<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Form</title>
</head>
<body>

<form name="contact" netlify>
  <input type="hidden" name="form-name" value="contact" />
  <p>
    <label>Name <input type="text" name="name" /></label>
  </p>
  <p>
    <label>Email <input type="email" name="email" /></label>
  </p>
  <p>
    Contact preference:
    <label><input type="radio" name="contact-preference" value="phone" /> Phone</label>
    <label><input type="radio" name="contact-preference" value="email" /> Email</label>
    <label><input type="radio" name="contact-preference" value="whatsapp" /> WhatsApp</label>
  </p>
  <p>
    <label>Budget
      <select name="budget">
        <option value="small">Small</option>
        <option value="medium">Medium</option>
        <option value="large">Large</option>
      </select>
    </label>
  </p>
  <p>
    <button type="submit">Send</button>
  </p>
</form>

<script>
  console.log("Form page loaded.");

  const form = document.querySelector('form[name="contact"]');

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const formData = new FormData(form);
    console.log("Submitting form data:");
    for (const [key, value] of formData.entries()) {
      console.log(`  ${key}:`, value);
    }

    fetch('/form.html', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(formData).toString()
    })
      .then((response) => {
        console.log("Netlify response status:", response.status, response.statusText);
        if (response.ok) {
          console.log("Form submitted successfully.");
        } else {
          console.error("Form submission failed.");
        }
      })
      .catch((error) => {
        console.error("Form submission error:", error);
      });
  });
</script>

</body>
</html>
