backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "site"
    label: "תוכן האתר"
    files:
      - name: "hero"
        label: "כותרת ראשית (הירו)"
        file: "content/site.json"
        fields:
          - { label: "טקסט רגיל", name: "heading_main", widget: "string" }
          - { label: "טקסט מודגש (ירוק)", name: "heading_highlight", widget: "string" }
