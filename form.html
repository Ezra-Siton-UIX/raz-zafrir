<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Form</title>
</head>
<body>

<form name="contact" netlify>
  <p>
    <label>Name <input type="text" name="name" /></label>
  </p>
  <p>
    <label>Email <input type="email" name="email" /></label>
  </p>
  <p>
    Contact preference:
    <label><input type="radio" name="contact-preference" value="phone" /> Phone</label>
    <label><input type="radio" name="contact-preference" value="email" /> Email</label>
    <label><input type="radio" name="contact-preference" value="whatsapp" /> WhatsApp</label>
  </p>
  <p>
    <label>Budget
      <select name="budget">
        <option value="small">Small</option>
        <option value="medium">Medium</option>
        <option value="large">Large</option>
      </select>
    </label>
  </p>
  <p>
    <button type="submit">Send</button>
  </p>
</form>

</body>
</html>
